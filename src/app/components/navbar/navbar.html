<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/home">Store</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/products" routerLinkActive="active">Product</a>
        </li>
        <!-- Logged in: orders (admin sees all orders) -->
        <li class="nav-item" *ngIf="auth.isLoggedIn()">
          <a class="nav-link" routerLink="/orders" routerLinkActive="active">{{ auth.isAdmin() ? 'Orders' : 'My Orders' }}</a>
        </li>
        <!-- Admin only -->
        <li class="nav-item" *ngIf="auth.isAdmin()">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        </li>
        <!-- Admin only -->
        <li class="nav-item" *ngIf="auth.isAdmin()">
          <a class="nav-link" routerLink="/add-product" routerLinkActive="active">Add Product</a>
        </li>
      </ul>

      <ul class="navbar-nav mb-2 mb-lg-0">
        <!-- Visitor -->
        <ng-container *ngIf="!auth.isLoggedIn(); else loggedIn">
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/register" routerLinkActive="active">Register</a>
          </li>
        </ng-container>

        <!-- Logged in (user or admin) -->
        <ng-template #loggedIn>
          <!-- Cart (normal users only) -->
          <li class="nav-item" *ngIf="!auth.isAdmin()">
            <a class="nav-link cart-link" routerLink="/cart" routerLinkActive="active" aria-label="Cart">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
              </svg>
              <span class="cart-badge" *ngIf="cart.count() > 0">{{ cart.count() }}</span>
            </a>
          </li>
          
          <li class="nav-item">
            <span class="nav-link user-name">Hi, {{ auth.user()?.name }}</span>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link" (click)="logout()">Logout</button>
          </li>
        </ng-template>
      </ul>
    </div>
  </div>
</nav>
