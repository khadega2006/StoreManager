<div class="container mt-5 pt-3">
  <h2>My Cart</h2>

  <!-- Empty cart -->
  <div *ngIf="cart.items().length === 0" class="empty-cart">
    <p>Your cart is empty</p>
    <a routerLink="/products">Browse products</a>
  </div>

  <!-- Items -->
  <div *ngIf="cart.items().length > 0">
    <div class="cart-item" *ngFor="let item of cart.items()">
      <img [src]="item.image_link" [alt]="item.name"
           (error)="$any($event.target).src = '/Hair care.png'">

      <div class="cart-info">
        <h5>{{ item.name }}</h5>
        <p>{{ item.price | currency }}</p>
      </div>

      <div class="qty">
        <button type="button" (click)="cart.decrease(item.id)">−</button>
        <span>{{ item.quantity }}</span>
        <button type="button" (click)="cart.increase(item.id)">+</button>
      </div>

      <div class="subtotal">{{ item.price * item.quantity | currency }}</div>

      <button type="button" class="remove-btn" (click)="cart.remove(item.id)">✕</button>
    </div>

    <!-- Total -->
    <div class="cart-total">
      <h4>Total: {{ cart.total() | currency }}</h4>
      <div class="cart-actions">
        <button type="button" class="clear-btn" (click)="cart.clear()">Clear cart</button>
        <button type="button" class="checkout-btn" routerLink="/checkout">Checkout</button>
      </div>
    </div>
  </div>
</div>
