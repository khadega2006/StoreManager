<div class="container mt-5">
    <h2>{{ editId ? 'Edit Product' : 'Add New Product' }}</h2>
    <form (ngSubmit)="submit()">

        <!-- Error -->
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

        <!-- Name -->
        <div class="mb-3">
            <label>Product Name</label>
            <input 
                type="text"
                class="form-control"
                name="name"
                [(ngModel)]="product.name"
                required
            >
        </div>

        <!-- Brand -->
        <div class="mb-3">
            <label>Brand</label>
            <input
                type="text"
                class="form-control"
                name="brand"
                [(ngModel)]="product.brand"
                required
            >
        </div>

        <!-- Price -->
        <div class="mb-3">
            <label >Price</label>
            <input 
                type="number"
                class="form-control"
                name="price"
                [(ngModel)]="product.price"
                required
            >
        </div>

        <!-- Category -->
        <div class="mb-3">
            <label>Category</label>
            <select
                class="form-select"
                name="category"
                [(ngModel)]="product.category"
                required
            >
                <option value="" disabled>Select a category</option>
                <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
            </select>
        </div>

        <!-- Description -->
        <div class="mb-3">
            <label>Description</label>
            <textarea
                class="form-control"
                name="description"
                [(ngModel)]="product.description"
                required
            ></textarea>
        </div>

        <!-- Image -->
        <div class="mb-3">
            <label>Image</label>
            <div *ngIf="editId && currentImage" class="mb-2">
                <img [src]="currentImage" alt="Current image" class="current-img">
                <small class="text-muted d-block">Current image (choose a file only if you want to change it)</small>
            </div>
            <input
                type="file"
                accept="image/*"
                class="form-control"
                name="image"
                (change)="onFileChange($event)"
            >
        </div>

        <!-- Button -->
        <button type="submit" class="btn add-btn" [disabled]="submitting">
            {{ editId ? 'Save Changes' : 'Add Product' }}
        </button>
    </form>
</div>
