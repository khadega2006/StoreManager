<div class="container mt-5 pt-3">

  <div *ngIf="category()" class="category-header">
    <h2>{{ category() }}</h2>
    <a routerLink="/products">View all products</a>
  </div>

  <!-- Search + sort -->
  <div class="toolbar">
    <input #searchBox type="search" class="form-control search-box" placeholder="Search by name or brand..."
           [value]="initialSearch" (input)="onSearchTyped(searchBox.value)">

    <select class="form-select sort-select" aria-label="Sort products" (change)="onSortChange($any($event.target).value)">
      <option *ngFor="let o of sortOptions" [value]="o.value" [selected]="o.value === sort()">{{ o.label }}</option>
    </select>

    <button *ngIf="search() || sort()" type="button" class="clear-btn" (click)="clearFilters(searchBox)">Clear</button>
  </div>

  <p *ngIf="!loading() && !errorMessage() && products().length > 0" class="results-count">
    {{ products().length }} {{ products().length === 1 ? 'product' : 'products' }}
  </p>

  <div *ngIf="loading()" class="text-center my-5">
    <div class="spinner-border" role="status"></div>
    <p>Loading products...</p>
  </div>

  <div *ngIf="errorMessage()" class="alert alert-danger">{{ errorMessage() }}</div>

  <div *ngIf="!loading() && !errorMessage() && products().length === 0" class="alert alert-warning">
    {{ search() ? 'No products match "' + search() + '"' : 'No products found' }}
  </div>

  <div class="row g-4">
    <div class="col-md-4" *ngFor="let prod of products()">
      <app-product-card [product]="prod" (viewDetails)="goToDetails($event)"></app-product-card>
    </div>
  </div>
</div>
